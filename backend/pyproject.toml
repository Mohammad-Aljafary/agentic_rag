[project]
name = "agentic-rag"
version = "0.1.0"
description = "Learning lab for agentic retrieval-augmented generation mechanisms."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "tiktoken>=0.13.0",
    "sqlalchemy>=2.0.51",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
agentic-rag = "agentic_rag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
